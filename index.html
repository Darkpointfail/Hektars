<html lang="fr">
<meta charset="utf-8">

<style>
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111014; --surface:#1a191e; --sunk:#232228; --ink:#ecebef; --muted:#9d99a6; --line:#2d2b33; --line2:#26252b;
  --side:#160b10; --side-ink:#f3e9ec; --side-muted:#a48f97; --side-hi:#2d1620;
  --accent:#e892ab; --accent-ink:#2a0b15; --accent-soft:#33191f;
  --R:#f2837a; --Rs:#3a1f1c; --P:#f0a54a; --Ps:#3a2a14; --A:#b69cf5; --As:#2d2542; --S:#7cb8e6; --Ss:#1a2d3d; --D:#a3b3c2; --Ds:#26303a;
  --good:#6cc38e; --goods:#16301f; --bad:#f2837a; --ly:#4d4a56; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111014; --surface:#1a191e; --sunk:#232228; --ink:#ecebef; --muted:#9d99a6; --line:#2d2b33; --line2:#26252b;
  --side:#160b10; --side-ink:#f3e9ec; --side-muted:#a48f97; --side-hi:#2d1620;
  --accent:#e892ab; --accent-ink:#2a0b15; --accent-soft:#33191f;
  --R:#f2837a; --Rs:#3a1f1c; --P:#f0a54a; --Ps:#3a2a14; --A:#b69cf5; --As:#2d2542; --S:#7cb8e6; --Ss:#1a2d3d; --D:#a3b3c2; --Ds:#26303a;

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}

.num{font-variant-numeric:tabular-nums}

select,input[type=search],textarea{font:inherit;font-size:.88rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 11px;min-width:0}

.demo{font-size:.8rem;color:var(--muted);display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.demo::before{content:"i";flex:none;width:18px;height:18px;border-radius:50%;background:var(--sunk);color:var(--muted);font:700 .7rem/18px var(--f-body);text-align:center;margin-top:1px}

.head{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-end;padding-bottom:4px}

.kpi b{font-family:var(--f-display);font-size:1.75rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15}
.kpi span{font-size:.78rem;color:var(--muted)}
.kpi.alert::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--R)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0;box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--line2)}
.panel-h p{margin:0;font-size:.8rem;color:var(--muted);flex-basis:100%}
.panel-h .num{font:600 .75rem var(--f-mono);background:var(--sunk);padding:2px 8px;border-radius:99px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
ul.acts{list-style:none;margin:0;padding:0}
ul.acts li{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line2);align-items:flex-start}
ul.acts li:last-child{border-bottom:0}

.acts .t{font-weight:600}
.acts .w{font-size:.8rem;color:var(--muted);margin-top:2px}
.acts .v,ul.checks .v{font:500 .78rem var(--f-mono);white-space:nowrap;background:var(--sunk);padding:3px 8px;border-radius:6px;color:var(--ink);margin-top:1px}

.c-R{background:var(--Rs);color:var(--R)}.c-P{background:var(--Ps);color:var(--P)}.c-A{background:var(--As);color:var(--A)}.c-S{background:var(--Ss);color:var(--S)}.c-D{background:var(--Ds);color:var(--D)}
.c-O{background:var(--R);color:var(--surface)}.c-L{background:var(--Ps);color:var(--P)}
.c-RA{background:var(--accent-soft);color:var(--accent)}.c-SA{background:var(--Ss);color:var(--S)}.c-SL{background:var(--sunk);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;box-shadow:0 0 0 3px var(--sunk)}
.lnk{color:inherit;text-decoration:none;cursor:pointer;background:none;border:0;font:inherit;padding:0;text-align:left}

.btn{font:inherit;font-size:.84rem;font-weight:600;border-radius:8px;padding:8px 13px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.76rem}
.stop{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.stop-h{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line2)}
.stop-h .meta{min-width:0;display:flex;flex-direction:column;gap:3px}
.stop-h h2{font-size:1.15rem}
.stop-stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.8rem;color:var(--muted)}
.stop-stats b{font-variant-numeric:tabular-nums;color:var(--ink)}
.goal{padding:14px 18px 4px;font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pitch{margin-top:6px;font-size:.8rem;background:var(--accent-soft);border-radius:8px;padding:7px 10px;color:var(--ink)}
.pitch b{color:var(--accent)}
.up{color:var(--good)}.down{color:var(--bad)}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters input[type=search]{flex:1 1 240px}
.dfilters{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}.dfl{display:flex;flex-direction:column;gap:6px}.dfl select{font:inherit;font-size:.9rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.agrp-h .t{font-weight:700}
.agrp{border-bottom:1px solid var(--line)}.agrp:last-child{border-bottom:0}.agrp-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px 4px;flex-wrap:wrap}
ul.checks{list-style:none;margin:0;padding:0 18px 10px}ul.checks li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line2)}ul.checks li:first-child{border-top:0}
ul.checks label{display:flex;gap:10px;flex:1;min-width:0;cursor:pointer}ul.checks input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--accent)}ul.checks .body{display:block;min-width:0}ul.checks .w{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}ul.checks .t{font-weight:600}
ul.checks input:checked+.body .t{text-decoration:line-through;color:var(--muted)}
.panel:has(.combo){overflow:visible}.combo{position:relative;flex:1;min-width:220px}.combo input{width:100%}.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);z-index:30;max-height:340px;overflow:auto;padding:4px}.combo-list.sugg{display:none}.combo:focus-within .combo-list.sugg{display:block}.combo-opt{display:flex;width:100%;gap:8px;align-items:center;padding:9px 10px;border:0;border-radius:7px;background:none;color:var(--ink);font:inherit;font-size:.88rem;text-align:left;cursor:pointer}.combo-opt:hover,.combo-opt:focus{background:var(--sunk);outline:none}.combo-opt .muted{margin-left:auto;font-size:.76rem;white-space:nowrap}.combo-empty{padding:10px;color:var(--muted);font-size:.85rem}.chips{display:flex;flex-wrap:wrap;gap:6px}.pick{font:inherit;font-size:.8rem;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}.pick:hover{border-color:var(--accent)}.pick.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--accent)}
.agrp.fin{opacity:.6}textarea.txt{resize:vertical;font-family:inherit}input.txt,textarea.txt{font:inherit;font-size:1rem;width:100%;max-width:480px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.seg.res{margin-top:8px}.seg.res button{font-size:.76rem;padding:5px 10px}
.seg.res .r-cmd[aria-pressed=true]{background:var(--good);border-color:var(--good);color:#fff}.seg.res .r-prom[aria-pressed=true]{background:var(--S);border-color:var(--S);color:#fff}.seg.res .r-non[aria-pressed=true]{background:var(--R);border-color:var(--R);color:#fff}.seg.res .r-nr[aria-pressed=true]{background:var(--P);border-color:var(--P);color:#fff}
.slform{display:flex;flex-wrap:wrap;gap:14px}.slform>label{flex:1 1 180px}input.cell,select.cell{font:inherit;font-size:.84rem;padding:5px 7px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink);max-width:180px}input.cell:hover,select.cell:hover,input.cell:focus,select.cell:focus{border-color:var(--line);background:var(--surface)}div.camp-act>.btn{flex:0 0 auto;width:auto;text-decoration:none}select.sel{font:inherit;font-size:.9rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}.slstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:8px 0}.slstats>div{background:var(--sunk);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}.slstats span{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}.slstats b{font-size:1.1rem}.slstats em{font-style:normal;font-size:.72rem;color:var(--muted)}.slform label{display:flex;flex-direction:column;gap:6px;font-size:.78rem;font-weight:600;color:var(--muted)}.slform select,.slform input{font:inherit;font-size:.95rem;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:200px}
.slt{font-size:.86rem}.slt-h,.slr summary{display:grid;grid-template-columns:minmax(0,2.4fr) repeat(3,minmax(64px,1fr));gap:10px;padding:10px 18px;align-items:center}
.slt-h{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}.slr{border-bottom:1px solid var(--line2)}.slr summary{cursor:pointer;list-style:none}.slr summary::-webkit-details-marker{display:none}.slr summary:hover{background:var(--sunk)}
.slr-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;padding:4px 18px 16px}.slr-b h4{margin:6px 0;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.slr-b ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.82rem}
.dtbar button{font-size:.88rem!important;padding:8px 16px!important}
.seg{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.seg button{font:inherit;font-size:.78rem;font-weight:600;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.colorsw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0;box-shadow:0 0 0 1px var(--line)}
.pdetail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
@media (max-width:980px){.pdetail{grid-template-columns:1fr}}
.photo{aspect-ratio:4/5;max-width:100%;max-height:360px;background:var(--sunk);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:.84rem;text-align:center;padding:12px;border:1px dashed var(--line)}
.photo img{width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:0;margin:0;font-size:.86rem;border-top:1px solid var(--line2)}

.pad{padding:16px 18px;display:flex;flex-direction:column;gap:14px}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.empty{padding:20px 18px;color:var(--muted);font-size:.86rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:10px;font-size:.84rem;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.addrow select{flex:1 1 260px;border-style:dashed}

  .app{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;flex-direction:row;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand{padding:0}.brand small{display:none}
  .side-foot{margin:0 0 0 auto;flex-direction:row}
  .who{padding:6px 10px}.who label span{display:none}.stamp{display:none}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--side);flex-direction:row;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  nav.tabs a{flex-direction:column;gap:3px;font-size:.66rem;padding:9px 4px;flex:1;justify-content:center;border-radius:0}
  nav.tabs a[aria-current=page]{box-shadow:inset 0 3px 0 #e892ab;background:none}
  main{padding-block:20px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  h1{font-size:1.35rem}
  .hide-sm{display:none}
}
.gate .side nav,.gate .side-foot{visibility:hidden}
.gatebox{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.gate-logo{width:220px;max-width:70%;height:auto;background:#fff;border-radius:14px;padding:14px 18px;box-sizing:content-box;border:1px solid var(--line,#e6dfe2)}
.gate-err{color:var(--bad);font-size:.88rem;margin:0}
.signout{background:none;border:0;color:var(--side-muted);font:inherit;font-size:.74rem;text-align:left;padding:0 8px;cursor:pointer}
.signout:hover{color:var(--side-ink)}
code.bm{display:block;font:12px/1.45 var(--f-mono);background:var(--sunk);padding:10px 12px;border-radius:8px;overflow-x:auto;white-space:nowrap}
.steps{margin:0 0 10px;padding-left:20px;display:grid;gap:10px}.steps .btn{margin-left:6px}
.calko{margin:6px 0 0;padding-left:18px;font-size:.84rem;display:grid;gap:3px}
.stl{margin-top:4px}.stl summary{font-size:.76rem;color:var(--accent);cursor:pointer}.stl .w{margin-top:4px}
.lossbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk);margin-bottom:10px}.lossbar i{display:block;height:100%}
.lossl{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:6px;font-size:.85rem}.lossl li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
[hidden]{display:none!important}
.loginf{display:flex;flex-direction:column;gap:12px;width:100%}.loginf label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}.loginf input{font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.calrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script>
// ---------- Connexion, chargement des données, synchronisation ----------
const SB=supabase.createClient(HK_CONFIG.url,HK_CONFIG.anonKey,{auth:{persistSession:true,detectSessionInUrl:true,flowType:'pkce'}});
const GCAL_SCOPE='https://www.googleapis.com/auth/calendar.readonly';
let ME=null,IS_ADMIN=false,SETTINGS={};
const view=()=>document.getElementById('view');
function screen(html){document.querySelector('.app').classList.add('gate');view().innerHTML=`<div class="gatebox">${html}</div>`}
async function signIn(withCalendar){
  await SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,scopes:withCalendar?GCAL_SCOPE:undefined,queryParams:withCalendar?{prompt:'consent',access_type:'online'}:undefined}});
}
window.hkSignIn=signIn;
window.hkSignOut=async()=>{try{sessionStorage.removeItem('hk-gtoken')}catch(e){}await SB.auth.signOut();location.hash='';location.reload()};
const USE_GOOGLE=false; // connexion Google et agenda : désactivés pour l'instant
const LOGIN_DOMAIN='hektars-terrain.app';
const loginEmail=id=>{id=String(id||'').trim().toLowerCase();return id.includes('@')?id:id.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9.-]/g,'')+'@'+LOGIN_DOMAIN};
function loginScreen(msg){screen(`<img class="gate-logo" src="img/logo.png" alt="Hektars">
  <h1>Hektars Terrain</h1><p class="muted">Connecte-toi avec ton identifiant et ton mot de passe.</p>${msg?`<p class="gate-err">${msg}</p>`:''}
  <form id="loginf" class="loginf"><label>Identifiant<input id="lid" autocomplete="username" autocapitalize="none" required placeholder="ton prénom"></label>
  <label>Mot de passe<input id="lpw" type="password" autocomplete="current-password" required></label>
  <button class="btn primary" type="submit">Se connecter</button></form>`);
  document.getElementById('loginf').onsubmit=async ev=>{ev.preventDefault();const b=ev.target.querySelector('button');b.disabled=true;b.textContent='Connexion…';
    const {error}=await SB.auth.signInWithPassword({email:loginEmail(document.getElementById('lid').value),password:document.getElementById('lpw').value});
    if(error){b.disabled=false;b.textContent='Se connecter';const e=document.querySelector('.gatebox .gate-err')||Object.assign(document.createElement('p'),{className:'gate-err'});e.textContent='Identifiant ou mot de passe incorrect.';ev.target.before(e);return}
    location.reload()}}

async function loadData(){
  const {data:snap,error:e1}=await SB.from('snapshots').select('id,ref,extracted_at,shared').order('id',{ascending:false}).limit(1).maybeSingle();
  if(e1)throw e1;
  if(!snap)return null;
  const {data:parts,error:e2}=await SB.from('rep_snapshots').select('rep_name,payload').eq('snapshot_id',snap.id);
  if(e2)throw e2;
  const {data:sets}=await SB.from('product_settings').select('*');
  SETTINGS={};(sets||[]).forEach(r=>SETTINGS[r.fam_key]=r);
  // fusion des territoires visibles en un seul jeu de données
  const sh=snap.shared;const D={ref:sh.ref,gen:sh.gen,labels:sh.labels,F:sh.F,net:sh.net,reps:[],S:[],O:[],OBL:[],agg:{},lost:[]};
  parts.sort((a,b)=>a.rep_name.localeCompare(b.rep_name,'fr')).forEach(p=>{
    const ri=D.reps.length;D.reps.push(p.rep_name);const off=D.S.length;const pl=p.payload;
    pl.S.forEach(a=>D.S.push([a[0],a[1],a[2],ri,a[3],a[4],a[5],a[6],a[7],a[8],a[9],a[10],a[11],a[12],a[13],a[14],a[15]]));
    pl.O.forEach(o=>D.O.push([o[0]+off,...o.slice(1)]));
    pl.OBL.forEach(l=>D.OBL.push(l));
    Object.entries(pl.agg).forEach(([f,v])=>D.agg[f+'|'+ri]=v);
    (pl.lost||[]).forEach(l=>D.lost.push([l[0]+off,l[1],l[2]]));
  });
  return D;
}

// Réception d'une synchronisation envoyée par l'onglet EZFocus
let syncHandled=false;
function listenSync(){
  window.addEventListener('message',async e=>{
    if(e.origin!=='https://insights.ezfocus.ca'||!e.data||e.data.type!=='hektars-sync'||syncHandled)return;
    syncHandled=true;const src=e.source;
    const ack=(ok,error)=>{try{src.postMessage({type:'hektars-sync-ack',ok,error},e.origin)}catch(x){}};
    if(!IS_ADMIN){ack(false,'seul un administrateur peut synchroniser');syncHandled=false;return}
    screen('<h1>Synchronisation…</h1><p class="muted">Enregistrement des données EZFocus.</p>');
    try{
      const {shared,perRep}=e.data;
      const {data:snap,error}=await SB.from('snapshots').insert({ref:shared.ref,shared,created_by:ME.email}).select('id').single();
      if(error)throw error;
      const rows=Object.entries(perRep).map(([rep_name,payload])=>({snapshot_id:snap.id,rep_name,payload}));
      const {error:e2}=await SB.from('rep_snapshots').insert(rows);if(e2)throw e2;
      // historique : une ligne par représentant et par période (pour les courbes longues)
      ack(true);location.hash='#dashboard';location.reload();
    }catch(err){ack(false,err.message||String(err));screen(`<h1>Échec de la synchronisation</h1><p class="gate-err">${String(err.message||err)}</p>`);syncHandled=false}
  });
}

async function boot(){
  listenSync();
  screen('<p class="muted">Chargement…</p>');
  const {data:{session}}=await SB.auth.getSession();
  if(!session)return loginScreen();
  if(session.provider_token){try{sessionStorage.setItem('hk-gtoken',JSON.stringify({t:session.provider_token,exp:Date.now()+50*60e3}))}catch(e){}}
  const email=session.user.email.toLowerCase();
  const {data:me,error}=await SB.from('reps').select('*').eq('email',email).maybeSingle();
  if(error||!me)return loginScreen(`Ce compte n'a pas encore accès. Demande à l'administrateur de l'ajouter.`);
  ME=me;IS_ADMIN=me.role==='admin';
  let D;try{D=await loadData()}catch(err){return screen(`<h1>Erreur de chargement</h1><p class="gate-err">${String(err.message||err)}</p>`)}
  if(location.hash==='#sync')return screen('<h1>En attente des données EZFocus…</h1><p class="muted">Garde cette fenêtre ouverte.</p>');
  if(!D)return screen(`<h1>Aucune donnée pour l'instant</h1><p class="muted">Les données EZFocus arrivent bientôt. Reviens dans quelques minutes.</p>`);
  document.querySelector('.app').classList.remove('gate');
  window.__D=D;startApp();
}
function syncHelp(){const app=location.origin;
  const bm=`javascript:(()=>{const s=document.createElement('script');s.src='${app}/sync.js?'+Date.now();document.body.appendChild(s)})()`;
  return `<ol class="steps"><li>Une seule fois : glisse ce bouton dans ta barre de favoris Chrome : <a class="btn primary" href="${bm.replace(/"/g,'&quot;')}" onclick="event.preventDefault();alert('Glisse ce bouton dans ta barre de favoris, puis clique dessus depuis EZFocus.')">Synchroniser Hektars</a></li>
  <li>Ouvre <a href="https://insights.ezfocus.ca" target="_blank" rel="noopener">EZFocus</a> et connecte-toi comme d'habitude, sur la page d'accueil (celle qui affiche « Last completed period »).</li>
  <li>Clique le favori « Synchroniser Hektars ». EZFocus lit les ${'magasins et produits'} avec ta session, puis ouvre cette application qui enregistre les données. Compte une à deux minutes.</li></ol>
  <p class="muted" style="font-size:.8rem;margin:0">Aucun mot de passe n'est lu ni stocké : la lecture se fait dans ton propre onglet EZFocus.</p>`}
window.hkSyncHelp=syncHelp;
function gToken(){try{const v=JSON.parse(sessionStorage.getItem('hk-gtoken'));return v&&v.exp>Date.now()?v.t:null}catch(e){return null}}
async function todaysEvents(){const t=gToken();if(!t)return null;
  const a=new Date();a.setHours(0,0,0,0);const b=new Date(a);b.setDate(b.getDate()+1);
  const r=await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&timeMin='+a.toISOString()+'&timeMax='+b.toISOString(),{headers:{Authorization:'Bearer '+t}});
  if(r.status===401){try{sessionStorage.removeItem('hk-gtoken')}catch(e){}return null}
  if(!r.ok)throw new Error('Google Agenda : erreur '+r.status);
  return (await r.json()).items||[];
}
</script>
<script>
function startApp(){
const D=window.__D;
const S=D.S.map(a=>({no:a[0],n:a[1],v:a[2],rep:D.reps[a[3]],ri:a[3],ban:a[4],rang:a[5],lv:a[6],nv:a[7],days:a[8],t13:a[9],l13:a[10],t3:a[11],l3:a[12],inactive:!!a[13],pt:a[14],pl:a[15],sku:a[16]}));
const F=D.F.map(a=>({n:a[0],fmt:a[1],px:a[2],type:a[3],cat:a[4],col:a[5],pays:a[6],cep:a[7],app:a[8],codes:a[9],dpc:a[10],t13:a[11],l13:a[12],t3:a[13],l3:a[14],nT13:a[15],nL13:a[16],nT3:a[17],nObl:a[18]}));
Object.values(SETTINGS).forEach(r=>{const c=r.custom;if(!c||!c.n)return;if(F.some(f=>f.n+'|'+f.fmt===r.fam_key))return;
  F.push({n:c.n,fmt:+c.fmt||750,px:+c.px||0,type:'',cat:c.color||'Autre',col:'',pays:c.pays||'',cep:'',app:'',codes:c.code?[String(c.code)]:[],dpc:0,t13:0,l13:0,t3:0,l3:0,nT13:0,nL13:0,nT3:0,nObl:0,custom:c})});
const OBLSET=D.OBL.map(l=>new Set(l));
const isObl=(si,fi)=>OBLSET[si].has(fi);
const AGG={};Object.entries(D.agg).forEach(([k,v])=>AGG[k]=v);
function famSeries(fi,ri){if(ri==null){const n=D.net[fi];return n?{t:n[0],l:n[1]}:{t:Array(13).fill(0),l:Array(13).fill(0)}}const t=Array(13).fill(0),l=Array(13).fill(0);D.reps.forEach((r,i)=>{if(ri!=null&&i!==ri)return;const a=AGG[fi+'|'+i];if(a)for(let k=0;k<13;k++){t[k]+=a[0][k];l[k]+=a[1][k]}});return {t,l}}
document.getElementById('ref').textContent='période '+D.ref;
let byStore,byFam;
function reindex(){byStore=S.map(()=>[]);byFam=F.map(()=>[]);
D.O.forEach(o=>{const r={s:o[0],f:o[1],t:o[2],t13:o[3],l13:o[4],t3:o[5],l3:o[6],inv:o[7],p25:o[8],p50:o[9],np:o[10],v:o[11]};byFam[r.f].push(r);if(isActive(r.f))byStore[r.s].push(r)});
S.forEach((s,i)=>{s.i=i;const c={O:0,L:0,R:0,P:0,D:0,A:0,S:0,V:0,N:0};let pot=0;byStore[i].forEach(o=>{c[o.t]++;if(o.t!=='D'&&o.t!=='V')pot+=o.v});s.c=c;s.invSusp=s.sku>0&&c.R/s.sku>0.6;s.pot=pot})}
const TYPES={O:'OBL manquant',L:'Stock faible',V:'SL en vente',N:'SL à placer',R:'Rupture',P:'Inscription perdue',A:'À proposer',S:'Sous les pairs',D:'Stock dormant'};
const dataDate=new Date(D.gen+'T12:00').toLocaleDateString('fr-CA',{day:'numeric',month:'long',year:'numeric'});
document.getElementById('stamp').textContent=dataDate;
const BAN={SEL:'Sélection',CLA:'Classique',EXP:'Express'};

// formatting
const nf0=new Intl.NumberFormat('fr-CA',{maximumFractionDigits:0}),nf1=new Intl.NumberFormat('fr-CA',{maximumFractionDigits:1});
const cs=v=>v>=10||v===0?nf0.format(v):nf1.format(v);
const money=v=>cs(v)+' cs/an';
const gr=(a,b)=>b>0?(a/b-1):null;
const pctH=r=>r==null?'—':`<span class="${r>=0?'up':'down'}">${r>=0?'+':''}${nf0.format(r*100)} %</span>`;
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const size=ml=>ml>=1000?nf1.format(ml/1000)+' L':ml+' ml';
const pname=f=>`${f.n} ${size(f.fmt)}`;
function why(o){switch(o.t){
  case 'R':return `${cs(o.t3)} cs vendues sur 3 périodes, aucun stock au dernier relevé.`;
  case 'O':return `Produit OBL (planogramme) sans stock : faute du magasin, à corriger.`;
  case 'L':return `Seulement ${nf0.format(o.inv)} unité${o.inv>1?'s':''} en stock${o.t3>0?`, ${cs(o.t3)} cs vendues sur 3 périodes`:''}.`;
  case 'V':return `${cs(o.t3)} cs vendues sur 3 périodes, ${nf0.format(o.inv)} unités encore en stock.`;
  case 'N':return `Absent ici. ${o.np} magasins comparables le vendent depuis 3 périodes (${cs(o.v)} cs en médiane).`;
  case 'P':return `${cs(Math.max(o.t13,o.l13))} cs/an au meilleur, plus de ventes ni de stock depuis 3 périodes.`;
  case 'D':return `${nf0.format(o.inv)} unités en stock, aucune vente sur 3 périodes.`;
  case 'A':return `Jamais vendu ici en 2 ans. ${o.np} des 20 magasins comparables le vendent (${cs(o.p50)} cs/an en médiane).`;
  case 'S':return `${cs(o.t13)} cs/an ici contre ${cs(o.p50)} en médiane chez les pairs.`;}}

// product classification
function colorOf(cat){const c=cat.toLowerCase();
  if(c.startsWith('s-'))return 'Spiritueux';if(c.includes('mousseux'))return 'Mousseux';if(c.includes('rosé'))return 'Rosé';
  if(c.includes('0,5%')||c.includes('léger'))return 'Désalcoolisé / léger';if(c.includes('cooler'))return 'Prêt-à-boire';
  if(c.includes('dessert'))return 'Dessert';if(c.startsWith('vin rg'))return 'Rouge';if(c.startsWith('vin bl'))return 'Blanc';return 'Autre'}
const COLORS={'Rouge':'#8c1c2c','Blanc':'#e8d98a','Rosé':'#f0a3b4','Mousseux':'#cfe3a6','Spiritueux':'#b07a3c','Dessert':'#c9902a','Désalcoolisé / léger':'#9ec7d6','Prêt-à-boire':'#b8a6e0','Autre':'#bbbbbb'};
const COLMAP={RED:'Rouge',WHITE:'Blanc',ROSE:'Rosé'};
F.forEach((f,i)=>{f.i=i;const c=colorOf(f.cat);f.color=(c==='Autre'||c==='Rouge'||c==='Blanc'||c==='Rosé')&&COLMAP[f.col]?COLMAP[f.col]:c});
F.forEach(f=>{if(f.custom&&COLORS[f.custom.color])f.color=f.custom.color});

// préférences locales (représentant affiché, magasins ajoutés à la main)
const LS={get(k,d){try{const v=localStorage.getItem('hk-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('hk-'+k,JSON.stringify(v));return true}catch(e){return false}}};
const fk=f=>f.n+'|'+f.fmt;
const setOf=f=>SETTINGS[fk(f)]||{};
const isActive=fi=>setOf(F[fi]).active!==false;
reindex();
const EZTYPE={'Régulier':'RA','Spec Appro':'SA','Spec Lot':'SL'};
const prodType=f=>setOf(f).saq_type||EZTYPE[f.type]||'';
const typeChip=f=>{const t=prodType(f);return t?`<span class="chip c-${t}">${t}</span>`:'<span class="chip c-SL">à saisir</span>'};
const pitchOf=f=>setOf(f).pitch||'';
const photosOf=f=>(setOf(f).photos||[]).slice();
async function saveSet(f,patch,msg){const key=fk(f);const row={...(SETTINGS[key]||{fam_key:key}),...patch,fam_key:key,updated_by:ME.email,updated_at:new Date().toISOString()};
  const {data,error}=await SB.from('product_settings').upsert(row).select().single();
  if(error){toast('Enregistrement impossible : '+error.message);return false}
  SETTINGS[key]=data;reindex();render();if(msg)toast(msg);return true}
const ro=IS_ADMIN?'':' disabled';

// state
const st={rep:IS_ADMIN?LS.get('rep',ME.rep_name):ME.rep_name,page:'aujourdhui',fam:null,q:'',color:'',ptype:'',route:null,dt:LS.get('dt',''),calls:LS.get('calls',[]),cq:''};
const reps=D.reps;
const repSel=document.getElementById('rep');
repSel.innerHTML=reps.map(r=>`<option${r===st.rep?' selected':''}>${esc(r)}</option>`).join('');
if(!reps.includes(st.rep))st.rep=reps.includes(ME.rep_name)?ME.rep_name:reps[0];
if(!IS_ADMIN||reps.length<2)repSel.disabled=true;
document.getElementById('navsync').hidden=true; // synchro gérée hors de l'appli
repSel.onchange=()=>{st.rep=repSel.value;LS.set('rep',st.rep);st.route=null;if(st.cal&&st.cal.state==='ok')st.cal=null;render()};
const myStores=()=>S.filter(s=>s.rep===st.rep&&!s.inactive);

function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2200)}
function copy(text){const ok=()=>toast('Copié');try{navigator.clipboard.writeText(text).then(ok,()=>fallbackCopy(text))}catch(e){fallbackCopy(text)}}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copié')}catch(e){toast('Sélectionne le texte pour le copier')}ta.remove()}

// ---------- Sur la route ----------
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\bst(e?)\b\.?/g,'saint$1').replace(/\bboul\b\.?/g,'boulevard').replace(/[^a-z0-9]+/g,' ').trim();
// Retrouve le magasin d'un rendez-vous : numéro de succursale d'abord, sinon nom de la succursale.
function matchStore(ev,stores){const txt=[ev.summary,ev.location,ev.description].join(' ');
  const byNo=new Map(stores.map(s=>[s.no,s]));
  for(const m of txt.match(/\b\d{5}\b/g)||[])if(byNo.has(m))return byNo.get(m);
  const t=' '+norm(txt)+' ';let best=null,bs=0;
  stores.forEach(s=>{const n=norm(s.n);let sc=0;
    if(t.includes(' '+n+' '))sc=100+n.length;
    else{const [a,b]=s.n.split(' - ');if(b){const na=norm(a),words=norm(b).split(' ').filter(w=>w.length>=4&&!['boulevard','saint','route','chemin','avenue','centre'].includes(w));
      if(t.includes(' '+na+' ')&&words.some(w=>t.includes(' '+w+' ')))sc=50+na.length}}
    if(sc>bs){bs=sc;best=s}else if(sc&&sc===bs)best=null});
  return best}
function loadCal(){st.cal={state:'loading'};
  todaysEvents().then(ev=>{if(ev==null){st.cal={state:'none'};return}
    const ms=S.filter(s=>s.rep===st.rep);
    const items=ev.filter(e=>e.status!=='cancelled').map(e=>{const s=matchStore(e,ms);const st0=e.start&&(e.start.dateTime||e.start.date);
      return {e,s,time:e.start&&e.start.dateTime?new Date(st0).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'}):''}});
    st.cal={state:'ok',items,rep:st.rep};mergeCal()}).catch(err=>{st.cal={state:'err',msg:err.message}}).finally(()=>{if(st.page==='route')render()})}
function routeKey(){return 'route-'+st.rep+'-'+todayKey()}
function getRoute(){if(!st.route)st.route=LS.get(routeKey(),{stops:[],rm:[]});if(Array.isArray(st.route))st.route={stops:st.route,rm:[]};return st.route}
function mergeCal(){const r=getRoute();if(!st.cal||st.cal.state!=='ok'||st.cal.rep!==st.rep)return;
  st.cal.items.forEach(it=>{if(it.s&&!r.stops.includes(it.s.no)&&!r.rm.includes(it.s.no))r.stops.push(it.s.no)});
  const order=new Map(st.cal.items.filter(i=>i.s).map((i,k)=>[i.s.no,k]));
  r.stops.sort((a,b)=>(order.has(a)?order.get(a):999)-(order.has(b)?order.get(b):999));saveRoute()}

    if(ty==='RA'){if(o.t==='O')add(o,'suivi','OBL sans stock : faire recommander');else if(o.t==='L'&&isObl(o.s,o.f))add(o,'suivi',`OBL en stock faible (${nf0.format(o.inv)} u.) : faire recommander`)}

      else if(o.t==='P')add(o,'marche',`Plus en magasin depuis au moins 3 périodes (${cs(Math.max(o.t13,o.l13))} cs/an au meilleur) : relancer`);

const CALLTXT={O:'OBL sans stock : faire recommander',R:'En rupture : faire recommander',L:o=>`Stock faible (${nf0.format(o.inv)} u.) : faire recommander`,P:o=>`Plus en magasin depuis au moins 3 périodes (${cs(Math.max(o.t13,o.l13))} cs/an au meilleur) : relancer`,

function sessStats(x){const rows=sessRows(x);const items=rows.flatMap(r=>r.it);const n={cmd:0,prom:0,non:0,nr:0,fait:0};items.forEach(y=>{const r=resOf(y.k);if(r)n[r]=(n[r]||0)+1});
  const done=items.filter(y=>isFin(y.k)).length;const stores=rows.filter(r=>r.it.every(y=>isFin(y.k))).length;
  return {rows,items:items.length,done,stores,nStores:rows.length,n,rate:(n.cmd+n.prom+n.non)?n.cmd/(n.cmd+n.prom+n.non):null}}

let SLL=[],SLL_LOCAL=false;
async function loadSL(){const {data,error}=await SB.from('sl_launches').select('*').order('created_at',{ascending:false});if(error){SLL_LOCAL=true;SLL=LS.get('sl',[]);return}SLL=data||[]}
async function saveSL(x){if(SLL_LOCAL){x.id=Date.now();SLL.unshift(x);LS.set('sl',SLL);return true}
  const {data,error}=await SB.from('sl_launches').insert(x).select().single();if(error){toast('Lancement non enregistré : '+error.message);return false}SLL.unshift(data);return true}
// vitesse de référence : lancements SL passés visibles sur les 13 périodes (caisses vendues en 6 semaines par magasin qui l'a vendu)
function slLaunches(){return F.filter(f=>prodType(f)==='SL'&&f.nT13>0).map(f=>{const t=famSeries(f.i,null).t;const tot=t.reduce((a,b)=>a+b,0);if(tot<40)return null;
    let k=-1;for(let j=1;j<12;j++){if(t[j]>0&&t.slice(0,j).reduce((a,b)=>a+b,0)<=tot*.03){k=j;break}}if(k<0)return null;
    const sold=Math.max(t[k]+.5*(t[k+1]||0),k+2<13?t[k+1]+.5*t[k+2]:0);return {f,k,sold,stores:f.nT13,rate:sold/f.nT13}}).filter(Boolean)}
function slBench(f){const all=slLaunches().filter(x=>x.f!==f);let cmp=all.filter(x=>x.f.color===f.color&&x.f.px>=f.px*.6&&x.f.px<=f.px*1.6);let basis='même couleur, prix comparable';
  if(cmp.length<3){cmp=all;basis='tous les SL lancés sur la période'}const r=cmp.map(x=>x.rate).sort((a,b)=>a-b);const med=r.length?r[Math.floor((r.length-1)/2)]:null;return {cmp,med,basis}}
function slPlan(f,qty){const b=slBench(f);if(!b.med||!qty)return {b,stores:[],need:0};const need=Math.min(Math.ceil(qty*.8/b.med),Math.floor(qty));
  const act=S.filter(s=>!s.inactive&&s.t3>0);const max=act.length*b.med/.8;
  const pool=act.sort((a,b)=>b.t3-a.t3).slice(0,need);const w=pool.reduce((a,s)=>a+s.t3,0);
  let alloc=pool.map(s=>({s,c:Math.max(1,Math.floor(qty*s.t3/w))}));let left=qty-alloc.reduce((a,x)=>a+x.c,0);
  for(let j=0;left>0&&alloc.length;j=(j+1)%alloc.length){alloc[j].c++;left--}while(left<0){const x=alloc.reduce((m,y)=>y.c>m.c?y:m);x.c--;left++}
  const used=Math.min(need,act.length);return {b,need,max,nAct:act.length,used,over:qty*.8>used*b.med*1.05,stores:alloc.filter(x=>x.c>0)}}
function slProgress(x){const f=F.find(y=>fk(y)===x.fam_key);if(!f)return null;const k=D.labels.indexOf(x.period);const t=famSeries(f.i,null).t;
  const sold=k>=0?t.slice(k).reduce((a,b)=>a+b,0):null;return {f,sold,target:x.qty*.8,pct:sold==null?null:sold/(x.qty*.8)}}
function slNewView(){const sl=F.filter(f=>isActive(f.i)&&prodType(f)==='SL').sort((a,b)=>a.n.localeCompare(b.n,'fr'));const f=sl.find(y=>fk(y)===st.slf);const qty=+st.slq||0;
  const p=f&&qty?slPlan(f,qty):null;const reps={};(p?p.stores:[]).forEach(x=>{(reps[x.s.rep]=reps[x.s.rep]||{n:0,c:0});reps[x.s.rep].n++;reps[x.s.rep].c+=x.c});

    <label>Période d'arrivée<select data-slp>${[...D.labels.slice(-3),'Prochaine'].map(l=>`<option${(st.slp||'Prochaine')===l?' selected':''}>${l}</option>`).join('')}</select></label></div></section>
  ${p?`<div class="kpis"><div class="kpi"><span>Objectif 6 semaines</span><b>${nf0.format(qty*.8)} cs</b><span>80 % de ${nf0.format(qty)} cs</span></div><div class="kpi"><span>Vitesse de référence</span><b>${p.b.med==null?'—':nf1.format(p.b.med)+' cs'}</b><span>par magasin en 6 semaines (${p.b.cmp.length} SL comparables)</span></div><div class="kpi"><span>Magasins à cibler</span><b>${p.used}</b><span>sur ${p.nAct} qui vendent du Hektars</span></div><div class="kpi"><span>Par magasin</span><b>${p.stores.length?nf1.format(qty/p.stores.length)+' cs':'—'}</b><span>en moyenne</span></div><div class="kpi${p.over?' alert':''}"><span>Lot max réaliste</span><b>${nf0.format(p.max)} cs</b><span>pour tenir 80 % en 6 sem. avec tous les magasins</span></div></div>
  ${p.over?`<div class="panel pad" style="border-color:var(--R)"><b>Objectif difficile à la vitesse habituelle.</b> Au maximum ${p.used} magasins peuvent recevoir le lot (${p.nAct} magasins vendent du Hektars, 1 cs minimum chacun). Chacun devra vendre ${nf1.format(qty*.8/p.used)} cs en 6 semaines, soit ${nf1.format(qty*.8/p.used/p.b.med)} fois la vitesse de référence : prévois de la mise en avant (dégustations, promo, îlots).</div>`:''}
  <section class="panel"><div class="panel-h"><h2>Comment c'est calculé</h2></div><div class="pad" style="font-size:.86rem;line-height:1.5">
   <p style="margin:0 0 8px">Vitesse de référence : médiane des SL déjà lancés (${esc(p.b.basis)}), caisses vendues sur leurs 6 premières semaines divisées par le nombre de magasins qui les ont vendus. Les magasins retenus sont ceux qui vendent le plus de Hektars sur les 3 dernières périodes. Les caisses sont réparties selon ces ventes.</p>
   <details class="stl"><summary>Voir les SL comparables</summary><div class="w">${p.b.cmp.map(x=>`${esc(pname(x.f))} : ${cs(x.sold)} cs en 6 sem. dans ${x.stores} magasins (${nf1.format(x.rate)} cs/mag.)`).join('<br>')}</div></details></div></section>

  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-sllaunch>Lancer : créer les sessions d'appels${IS_ADMIN?' (une par représentant)':''}</button></div>
  <section class="panel"><div class="panel-h"><h2>Magasins et caisses à proposer</h2><span class="muted num">${p.stores.length}</span></div><ul class="acts">${p.stores.map(x=>`<li><div class="body"><span class="t">${esc(x.s.n)}</span><div class="w">${esc(x.s.rep)} · ${esc(x.s.v)} · ${cs(x.s.t3)} cs Hektars sur 3 périodes</div></div><span class="v">${x.c} cs</span></li>`).join('')}</ul></section>`
  :(f&&qty?'<div class="panel empty">Pas assez d\'historique SL pour calculer une vitesse de référence.</div>':'')}`}
function slCards(){return SLL.map(x=>{const g=slProgress(x);if(!g)return '';const pct=g.pct==null?null:Math.min(1,g.pct);
  return `<li><div class="body"><span class="t">${esc(pname(g.f))}</span> <span class="chip c-SL">SL</span><div class="w">${nf0.format(x.qty)} cs reçues · arrivée ${esc(x.period)} · objectif ${nf0.format(g.target)} cs en 6 semaines · ${g.sold==null?'ventes visibles à la prochaine mise à jour EZFocus':`${cs(g.sold)} cs vendues depuis l'arrivée (${nf0.format(g.pct*100)} % de l'objectif)`}</div>

function mailDraft(){const m=st.mail;const fs=F.filter(f=>m.products.includes(fk(f)));if(!fs.length)return null;
  const s0=m.store?S.find(x=>x.no===m.store):null;const sx=m.sess?sessOf(m.sess):null;

    place:`Je me permets de vous proposer ${fs.length>1?'quelques produits':'un produit'} de notre portefeuille qui ${fs.length>1?'fonctionnent':'fonctionne'} bien dans des succursales comparables à la vôtre.`,
    relance:`Je fais un suivi : ${fs.length>1?'ces produits se vendaient':'ce produit se vendait'} bien chez vous et n'${fs.length>1?'y sont':'y est'} plus en tablette depuis quelques périodes. Je vous propose de ${fs.length>1?'les':'le'} remettre.`,
    rupture:`Je vois que ${fs.length>1?'ces produits sont':'ce produit est'} en rupture ou presque chez vous alors qu'${fs.length>1?'ils se vendent':'il se vend'} bien. Serait-il possible de recommander ?`}[kind];
  const PAYS={CHILE:'Chili',FRANCE:'France',GERMANY:'Allemagne',HUNGARY:'Hongrie','SOUTH AFRICA':'Afrique du Sud',SPAIN:'Espagne',ITALY:'Italie',PORTUGAL:'Portugal',ARGENTINA:'Argentine',AUSTRALIA:'Australie','NEW ZEALAND':'Nouvelle-Zélande','UNITED STATES':'États-Unis',CANADA:'Canada'};const cap=t=>t?(PAYS[t.toUpperCase()]||t.charAt(0)+t.slice(1).toLowerCase()):'';const line=f=>{const bits=[`${pname(f)}`,[f.app,cap(f.pays)].filter(Boolean).join(', ')||null,f.px?`${f.px.toLocaleString('fr-CA',{minimumFractionDigits:2,maximumFractionDigits:2})} $`:null,prodType(f)?prodType(f):null,f.codes&&f.codes[0]?`code SAQ ${f.codes[0]}`:null].filter(Boolean).join(' · ');
    const p=pitchOf(f);const ex=[];
    if(s0){const o=byStore[s0.i].find(o=>o.f===f.i);if(o){if(o.t==='A'||o.t==='N')ex.push(`Déjà vendu dans ${o.np} succursales comparables à la vôtre.`);if(o.t==='P')ex.push(`Il s'en vendait jusqu'à ${cs(Math.max(o.t13,o.l13))} caisses par an chez vous.`);if(o.t==='R'||o.t==='O')ex.push(`${cs(o.t3)} caisses vendues chez vous sur les 3 dernières périodes, plus de stock au dernier relevé.`);if(o.t==='L')ex.push(`Il ne reste que ${nf0.format(o.inv)} unités en stock.`);if(o.t==='D')ex.push(`${nf0.format(o.inv)} unités en stock chez vous sans vente depuis 3 périodes : une mise en avant le ferait bouger.`);if(o.t==='V')ex.push(`${cs(o.t3)} caisses vendues chez vous sur les 3 dernières périodes, ${nf0.format(o.inv)} unités encore en stock.`)}
      if(sx&&sx.plan&&sx.plan[s0.no]&&fk(f)===sx.products[0])ex.push(`Je vous propose ${cs(sx.plan[s0.no])} caisse${sx.plan[s0.no]>1?'s':''}.`)}
    else if(f.nT3)ex.push(`En vente actuellement dans ${f.nT3} succursales.`);
    const L=SLL.find(x=>x.fam_key===fk(f));if(kind==='sl'&&L)ex.push(`Lot de ${nf0.format(L.qty)} caisses pour tout le Québec.`);
    return `• ${bits}${p?`\n  ${p}`:''}${ex.length?`\n  ${ex.join(' ')}`:''}`};
  const outro={sl:`Souhaitez-vous que je vous en réserve ? Je peux passer vous le faire goûter cette semaine.`,place:`Seriez-vous ouvert à l'inscrire ? Je peux passer vous le faire goûter.`,relance:`Voulez-vous que je m'occupe de la commande ?`,rupture:`Merci de me confirmer quand la commande est passée.`}[kind];

function tastBars(rows,title){ // rows: [{label, sub, v}]

  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">`;
  rows.forEach((r,i)=>{const y=4+i*(bh+gap),w=(W-pl-pr)*r.v/max;
    s+=`<text x="${pl-10}" y="${y+bh/2-(r.sub?2:-4)}" text-anchor="end">${esc(r.label.length>24?r.label.slice(0,23)+'…':r.label)}</text>${r.sub?`<text x="${pl-10}" y="${y+bh/2+11}" text-anchor="end" style="font-size:9px;opacity:.7">${esc(r.sub.length>34?r.sub.slice(0,33)+'…':r.sub)}</text>`:''}

function tastTrend(list){ // ventes par dégustation, dans l'ordre chronologique

  const nice=v=>{const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p};const top=nice(max);
  const gw=(W-pl-pr)/a.length,bw=Math.min(40,gw*.62);const y=v=>pt+(H-pt-pb)*(1-v/top);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bouteilles vendues par dégustation">`;

  const avg=a.reduce((m,x)=>m+tQty(x),0)/a.length;

  s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--ly)" stroke-width="2" stroke-dasharray="4 3"/>`;

function lineChart(t,l,title,small){
  const W=small?780:620,H=small?160:230,pl=44,pr=12,pt=14,pb=26;const max=Math.max(...t,...l,1);
  const nice=v=>{const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p};const top=nice(max);
  const x=i=>pl+(W-pl-pr)*i/12,y=v=>pt+(H-pt-pb)*(1-v/top);
  const path=a=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">`;
  [0,.5,1].forEach(k=>{const v=top*k;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${nf0.format(v)}</text>`});
  D.labels.forEach((lb,i)=>{if(!small||i%2===0)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${lb}</text>`});
  s+=`<path d="${path(t)} L${x(12)} ${y(0)} L${x(0)} ${y(0)}Z" fill="var(--accent)" opacity=".1"/>`;
  s+=`<path d="${path(l)}" fill="none" stroke="var(--ly)" stroke-width="2" stroke-dasharray="4 3"/><path d="${path(t)}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  s+=`<circle cx="${x(12)}" cy="${y(t[12])}" r="4" fill="var(--accent)"/><text class="v" x="${x(12)-6}" y="${y(t[12])-9}" text-anchor="end">${nf0.format(t[12])}</text>`;
  return `<div class="eyebrow" style="margin-bottom:4px">${esc(title)}</div>`+s+'</svg><div class="legend"><span><i style="background:var(--accent)"></i>Cette année</span><span><i style="background:var(--ly)"></i>An passé (même période)</span></div>'}
function barChart(groups){ // groups: [{label, ly, ty}]
  const W=520,H=210,pl=10,pb=40,pt=24;
  const gw=(W-pl*2)/groups.length,bw=Math.min(54,gw/3);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventes cette année et l'an passé">`;
  for(let k=0;k<=3;k++){const y=pt+(H-pt-pb)*(k/3);s+=`<line x1="${pl}" x2="${W-pl}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`}
  groups.forEach((g,i)=>{const cx=pl+gw*i+gw/2;const max=Math.max(g.ly,g.ty,1);const h=v=>(H-pt-pb)*v/max;
    const x1=cx-bw-3,x2=cx+3;const y1=H-pb-h(g.ly),y2=H-pb-h(g.ty);
    s+=`<rect x="${x1}" y="${y1}" width="${bw}" height="${h(g.ly)}" fill="var(--ly)" rx="2"/><rect x="${x2}" y="${y2}" width="${bw}" height="${h(g.ty)}" fill="var(--accent)" rx="2"/>`;
    s+=`<text x="${x1+bw/2}" y="${y1-6}" text-anchor="middle">${g.fmt(g.ly)}</text><text class="v" x="${x2+bw/2}" y="${y2-6}" text-anchor="middle">${g.fmt(g.ty)}</text>`;
    s+=`<text x="${cx}" y="${H-pb+18}" text-anchor="middle">${esc(g.label)}</text>`});
  return s+'</svg><div class="legend"><span><i style="background:var(--ly)"></i>An passé</span><span><i style="background:var(--accent)"></i>Cette année</span></div>'}

// Périodes SAQ : 13 périodes de 4 semaines ; P01 commence le dimanche 29 mars 2026 (estimation, modifiable dans la fiche)
const P01=Date.UTC(2026,2,29),DAYMS=864e5;
function periodOfDate(iso){let d=(Date.parse(iso+'T00:00:00Z')-P01)/DAYMS;while(d<0)d+=364;while(d>=364)d-=364;return 'P'+String(Math.min(13,Math.floor(d/28)+1)).padStart(2,'0')}
function periodEnd(label){const n=+String(label).replace(/\D/g,'');let e=P01+n*28*DAYMS;const now=Date.now();while(e>now+28*DAYMS)e-=364*DAYMS;while(e<now-364*DAYMS)e+=364*DAYMS;return e}
function slInfo(f){const s=setOf(f);let qty=+s.sl_qty||0,start=s.sl_start||null,period=s.sl_period||null;
  if(!qty){const old=SLL.find(x=>x.fam_key===fk(f));if(old){qty=+old.qty||0;period=period||(old.period!=='Prochaine'?old.period:null)}}
  if(!period&&start)period=periodOfDate(start);
  const t=famSeries(f.i,null).t;const k=period?D.labels.indexOf(period):-1;const last=D.labels[D.labels.length-1];
  const dataEnd=periodEnd(last);const st0=start?Date.parse(start+'T00:00:00Z'):(k>=0?periodEnd(period)-28*DAYMS:null);
  let sold=null,soldAll=null;if(k>=0){soldAll=t.slice(k).reduce((a,b)=>a+b,0);
    // fenêtre de 6 semaines : reste de la période d'arrivée + la part de la suivante (périodes de 4 semaines)
    const pStart=periodEnd(period)-28*DAYMS;const o=st0!=null?Math.min(4,Math.max(0,(st0-pStart)/(7*DAYMS))):0;const r1=Math.min(1,Math.max(0,(6-(4-o))/4)),r2=Math.max(0,(6-(4-o)-4)/4);
    sold=(t[k]||0)+(t[k+1]||0)*r1+(t[k+2]||0)*r2}else if(period&&st0!=null&&st0>dataEnd){sold=0;soldAll=0}
  const weeks=st0==null?null:Math.max(0,(dataEnd-st0)/(7*DAYMS));const target=qty*.8;
  const expected=weeks==null?null:target*Math.min(1,weeks/6);const pct=sold!=null&&target?sold/target:null;
  const deadline=st0==null?null:st0+42*DAYMS;
  let state='saisir';if(qty&&st0!=null){if(st0>dataEnd)state='attente';else if(sold==null)state='inconnu';else if(sold>=target)state='atteint';else if(weeks>=6)state='rate';else if(sold>=expected*.9)state='ok';else state='retard'}
  else if(qty)state='date';
  const ops=byFam[f.i]||[];const cnt=t2=>ops.filter(o=>o.t===t2).length;
  const wNow=st0==null?null:(Date.now()-st0)/(7*DAYMS);const wh=s.sl_wh!=null&&s.sl_wh!==''?+s.sl_wh:null;
  return {f,wNow,wh,whAt:s.sl_wh_at||null,pctAll:soldAll!=null&&qty?soldAll/qty:null,qty,start,period,sold,soldAll,target,expected,pct,weeks,deadline,state,left:sold==null?null:Math.max(0,qty-sold),N:cnt('N'),Dd:cnt('D'),V:cnt('V'),stores:f.nT3,last}}
const SLSTATE={atteint:['Objectif atteint','var(--good)'],ok:['Dans les temps','var(--good)'],retard:['En retard','var(--R)'],rate:['Objectif manqué','var(--R)'],attente:['Pas encore arrivé','var(--P)'],inconnu:['Ventes non visibles','var(--muted)'],saisir:["Stock d'entrée à saisir",'var(--P)'],date:["Date d'arrivée à saisir",'var(--P)']};

function slSuiviView(){const all=F.filter(f=>prodType(f)==='SL'&&isActive(f.i));const showOld=!!st.slold;

    const week=r.weeks==null?'—':r.weeks<=0?'avant l\'arrivée':r.weeks>=6?'6 semaines passées':'semaine '+Math.ceil(r.weeks)+' sur 6';

const TERR=['Laurentides','Lanaudière','Laval','Montréal','Montérégie','Capitale-Nationale','Chaudière-Appalaches','Mauricie','Centre-du-Québec','Estrie','Outaouais','Abitibi-Témiscamingue','Saguenay–Lac-Saint-Jean','Bas-Saint-Laurent','Côte-Nord','Gaspésie–Îles-de-la-Madeleine','Nord-du-Québec','Autre'];
let CT=[],CT_LOCAL=false,CAMP=[],CAMP_LOCAL=false;
async function loadCt(){const {data,error}=await SB.from('contacts').select('*').order('name');if(error){CT_LOCAL=true;CT=LS.get('contacts',[]);}else CT=data||[];
  const r=await SB.from('email_campaigns').select('*').order('created_at',{ascending:false});if(r.error){CAMP_LOCAL=true;CAMP=LS.get('campaigns',[])}else CAMP=r.data||[]}
async function ctInsert(rows){if(CT_LOCAL){rows.forEach((r,i)=>{r.id=Date.now()+i;CT.push(r)});LS.set('contacts',CT);return true}
  for(let i=0;i<rows.length;i+=200){const {data,error}=await SB.from('contacts').insert(rows.slice(i,i+200)).select();if(error){toast('Import interrompu : '+error.message);return false}CT.push(...data)}return true}
async function ctUpdate(c,patch){Object.assign(c,patch);if(CT_LOCAL){LS.set('contacts',CT);return}const {error}=await SB.from('contacts').update(patch).eq('id',c.id);if(error)toast('Modification non enregistrée : '+error.message)}
async function ctDelete(ids){const set=new Set(ids.map(String));if(!CT_LOCAL){const {error}=await SB.from('contacts').delete().in('id',ids);if(error){toast('Suppression impossible : '+error.message);return}}
  CT=CT.filter(c=>!set.has(String(c.id)));if(CT_LOCAL)LS.set('contacts',CT);st.ctSel=new Set();render()}
async function campSave(x){if(CAMP_LOCAL){x.id=Date.now();CAMP.unshift(x);LS.set('campaigns',CAMP);return true}const {data,error}=await SB.from('email_campaigns').insert(x).select().single();if(error){toast('Campagne non enregistrée : '+error.message);return false}CAMP.unshift(data);return true}
const myCt=()=>CT.filter(c=>c.rep_name===st.rep);
const nrm=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function ctFiltered(){const q=nrm(st.ctq);return myCt().filter(c=>(!st.ctt||c.territory===st.ctt)&&(!st.ctr||(c.role||'')===st.ctr)&&(!q||nrm([c.name,c.email,c.role,c.territory,c.store_name,c.store_no].join(' ')).includes(q))).sort((a,b)=>(a.territory||'').localeCompare(b.territory||'','fr')||(a.store_name||'').localeCompare(b.store_name||'','fr')||(a.name||'').localeCompare(b.name||'','fr'))}
// lecture CSV (séparateur ; , ou tabulation, guillemets) ; Excel via SheetJS chargé à la demande
function parseCSV(txt){txt=txt.replace(/^﻿/,'');const first=txt.split(/\r?\n/)[0]||'';const sep=[';','\t',','].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let row=[],cell='',q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===sep){row.push(cell);cell=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cell+=ch}
  row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>ko(new Error('lecteur Excel indisponible'));document.head.appendChild(s)})}
function mapCols(head){const h=head.map(nrm);const used=new Set();
  const pick=(exact,...k)=>{let i=h.findIndex((x,n)=>!used.has(n)&&exact.includes(x));if(i<0)i=h.findIndex((x,n)=>!used.has(n)&&k.some(y=>x.includes(y)));if(i>=0)used.add(i);return i};
  const store_no=pick(['n° succursale','no succursale','numero succursale','n° magasin'],'n°','no succ','numero');
  const email=pick(['courriel','email','e-mail','adresse courriel'],'courriel','email','e-mail');
  const territory=pick(['territoire','region'],'territoire','region');
  const role=pick(['fonction','role','poste','titre'],'fonction','role (','poste','titre');
  const store_name=pick(['succursale','magasin','store'],'succursale','magasin');
  const name=pick(['nom','contact','name','prenom'],'nom','contact','name');
  const city=pick(['ville','city'],'ville');
  return {email,name,role,territory,store_no,store_name,city}}
function importRows(rows){if(rows.length<2)return {err:'Le fichier ne contient pas de lignes.'};const m=mapCols(rows[0]);if(m.email<0)return {err:'Aucune colonne de courriel trouvée (en-tête « Courriel » ou « Email »).'};
  const have=new Set(myCt().map(c=>nrm(c.email)));const seen=new Set();const out=[];let dup=0,bad=0;
  rows.slice(1).forEach(r=>{const g=i=>i>=0?String(r[i]??'').trim():'';const email=g(m.email).toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){bad++;return}
    if(have.has(email)||seen.has(email)){dup++;return}seen.add(email);
    let name=g(m.name);const sname=g(m.store_name);if(/courriel g[ée]n[ée]ral/i.test(name))name=sname?sname+' (général)':'Courriel général';
    const terrRaw=g(m.territory);const terr=TERR.find(t=>nrm(t)===nrm(terrRaw))||(terrRaw||'');
    out.push({email,name,role:g(m.role)||(/succ\d+@/.test(email)?'Magasin':''),territory:terr,store_no:g(m.store_no),store_name:sname,city:g(m.city)})});
  return {m,out,dup,bad,head:rows[0]}}

function briefData(){const ms=myStores();const keep=st.dt;st.dt='';const all=actionsFor(ms);st.dt=keep;

function slHard(ms){const nAct=S.filter(x=>!x.inactive&&x.t3>0).length||1;
  return F.filter(f=>isActive(f.i)&&prodType(f)==='SL'&&slStatus(f)==='actif').map(f=>{const r=slInfo(f);
    const tracked=r.qty&&r.sold!=null&&r.expected>0&&r.state!=='atteint'&&r.state!=='attente';
    const score=tracked?r.sold/r.expected:f.nT3/nAct;
    const why=tracked?`${cs(r.sold)} cs vendues sur ${cs(r.expected)} attendues à ce stade (${nf0.format(r.sold/r.expected*100)} %)`:`en vente dans ${f.nT3} magasins sur ${nAct}`;
    return {f,r,tracked,score,why,sugg:slSugg(f,ms)}}).filter(x=>x.score<1&&x.sugg.length).sort((a,b)=>(b.tracked-a.tracked)||a.score-b.score).slice(0,5)}
function slSugg(f,ms){const out=[];const seen=new Set();
  ms.forEach(s=>{const o=byStore[s.i].find(x=>x.f===f.i&&x.t==='N');if(o){seen.add(s.i);out.push({s,why:`absent, ${o.np} magasins comparables le vendent`,k:2,v:o.v||0})}});
  ms.forEach(s=>{if(seen.has(s.i)||s.inactive||!(s.t3>0))return;if(byStore[s.i].some(x=>x.f===f.i&&(x.t==='V'||x.t==='D')))return;out.push({s,why:`gros vendeur Hektars : ${cs(s.t3)} cs sur 3 périodes`,k:1,v:s.t3})});
  return out.sort((a,b)=>b.k-a.k||b.v-a.v).slice(0,12)}
function slHardPanel(ms){const l=slHard(ms);if(!l.length)return '';
  return `<section class="panel"><div class="panel-h"><h2>SL les plus durs à placer</h2><p>Les SL actifs les plus en retard sur l'objectif 80 % en 6 semaines (ou les moins présents en succursale si le stock d'entrée n'est pas saisi). Clique pour voir où les placer chez toi.</p></div>
  ${l.map(x=>`<details class="stl" style="border-top:1px solid var(--line2)"><summary style="cursor:pointer;padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>${esc(pname(x.f))}</b> ${slChip(x.f)}${x.r.qty?' '+slStateChip(x.r.state):''}<span class="muted" style="font-size:.82rem">${x.why}</span><span class="muted" style="margin-left:auto;font-size:.8rem">${x.sugg.length} suggestion${x.sugg.length>1?'s':''} ▾</span></summary>
    <ul class="acts">${x.sugg.map(y=>`<li><div class="body"><span class="t" style="font-weight:600">${esc(y.s.n)}</span><div class="w">${esc(y.s.v)} · n° ${y.s.no} · ${y.why} · ${y.s.days==null?'jamais visité':'visite il y a '+y.s.days+' j'}</div></div><button class="btn sm" data-addroute="${y.s.no}">+ Journée</button></li>`).join('')}</ul>
    <div style="padding:0 18px 12px"><button class="lnk" data-fam="${x.f.i}">Voir la fiche du produit</button></div></details>`).join('')}</section>`}

function noteText(s){const d=new Date().toLocaleDateString('fr-CA',{day:'numeric',month:'long',year:'numeric'});const keep=st.dt;st.dt='';const acts=actionsFor([s]);st.dt=keep;

  if(d.atab){st.atab=d.atab;st.more=0;render();return}

  if(d.addroute){const r=getRoute();if(!r.stops.includes(d.addroute))r.stops.push(d.addroute);r.rm=r.rm.filter(n=>n!==d.addroute);saveRoute();toast('Ajouté à ta journée');return}
  if(d.copystop)return copy(stopText(S[+d.copystop]));
  if(d.copyday!=null)return copy(getRoute().stops.map(no=>stopText(S.find(s=>s.no===no))).join('\n\n'));

        const url=SB.storage.from('product-photos').getPublicUrl(path).data.publicUrl;const p=photosOf(f);p.unshift(url);saveSet(f,{photos:p},'Photo ajoutée')},'image/jpeg',.82)};img.src=rd.result};rd.readAsDataURL(file)}

document.addEventListener('click',e=>{const t=e.target.closest('[data-ctimp],[data-ctimpx],[data-ctparse],[data-ctimpgo],[data-ctdel],[data-ctdelsel],[data-campnew],[data-campx],[data-campcopy],[data-campcsv],[data-campsave],[data-campopen],[data-campmt]');if(!t)return;const d=t.dataset;

    const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='campagne-'+isoDay(new Date())+'.csv';document.body.appendChild(a);a.click();a.remove();return}
